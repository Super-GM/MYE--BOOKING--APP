<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches List</title>
    <link rel="stylesheet" href="matches-style.css">
</head>

<body>
    <div class="top-bar">
        <div class="logo">
            Matches List
        </div>
        <div class="search-box">
            <span style="font-size:1.2em; padding-left:5px;">🔍</span>
            <input type="text" placeholder="Search Matches...">
        </div>
    </div>

    <div class="content">
        <h1>Upcoming Matches</h1>
        <div class="matches-window">
            <div class="matches-list">
                <div class="match-card">
                    <div class="match-details">
                        <div class="teams">Team A VS Team B</div>
                        <p>25th Oct, 7:00 PM</p>
                        <p>Stadium XYZ</p>
                    </div>
                    <button class="view-details-btn">View</button>
                </div>

                <div class="match-card">
                    <div class="match-details">
                        <div class="teams">Team C VS Team D</div>
                        <p>27th Oct, 6:00 PM</p>
                        <p>Arena ABC</p>
                    </div>
                    <button class="view-details-btn">View</button>
                </div>

                <div class="match-card">
                    <div class="match-details">
                        <div class="teams">Team E VS Team F</div>
                        <p>30th Oct, 5:00 PM</p>
                        <p>Field 123</p>
                    </div>
                    <button class="view-details-btn">View</button>
                </div>

                <div class="match-card">
                    <div class="match-details">
                        <div class="teams">Team G VS Team H</div>
                        <p>1st Nov, 8:00 PM</p>
                        <p>Main Stadium</p>
                    </div>
                    <button class="view-details-btn">View</button>
                </div>

                <div class="match-card">
                    <div class="match-details">
                        <div class="teams">Team I VS Team J</div>
                        <p>3rd Nov, 4:00 PM</p>
                        <p>City Ground</p>
                    </div>
                    <button class="view-details-btn">View</button>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
